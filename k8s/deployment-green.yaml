apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
spec:
  replicas: 2
  selector:
    matchLabels:
      version: green
  template:
    metadata:
      labels:
        app: my-app
        version: green
    spec:
      containers:
      - name: web
        image: europe-west4-docker.pkg.dev/project-sem-489814/app-repo/micro:test
        ports:
        - containerPort: 80
